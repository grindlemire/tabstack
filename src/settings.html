<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>tabstack settings</title>
		<style>
			/* System fonts only: tabstack makes no network requests, fonts included. */
			:root {
				--bg: #f5f5f7;
				--group: #ffffff;
				--fg: #1d1d1f;
				--muted: #86868b;
				--line: rgba(0, 0, 0, 0.08);
				--cap-top: #ffffff;
				--cap-bottom: #f0f0f3;
				--cap-edge: rgba(0, 0, 0, 0.16);
				--track: rgba(0, 0, 0, 0.2);
				--accent: #3b6cf6;
				--accent-soft: rgba(59, 108, 246, 0.12);
				--error: #d93025;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #18181a;
					--group: #242427;
					--fg: #f5f5f7;
					--muted: #8e8e93;
					--line: rgba(255, 255, 255, 0.08);
					--cap-top: #3a3a3e;
					--cap-bottom: #2e2e32;
					--cap-edge: rgba(0, 0, 0, 0.5);
					--track: rgba(255, 255, 255, 0.16);
					--accent: #5b85ff;
					--accent-soft: rgba(91, 133, 255, 0.16);
					--error: #ff6b5b;
				}
			}

			* { box-sizing: border-box; }
			body {
				width: 340px;
				margin: 0;
				padding: 14px 12px 12px;
				font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
				color: var(--fg);
				background: var(--bg);
				-webkit-font-smoothing: antialiased;
			}

			header {
				display: flex;
				align-items: center;
				gap: 9px;
				padding: 0 4px 12px;
			}
			header img { width: 22px; height: 22px; }
			header h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -0.01em; }

			h2 {
				margin: 0 0 6px;
				padding: 0 12px;
				font-size: 11px;
				font-weight: 600;
				letter-spacing: 0.06em;
				text-transform: uppercase;
				color: var(--muted);
			}
			section + section { margin-top: 14px; }

			.group {
				background: var(--group);
				border-radius: 12px;
				box-shadow: 0 0 0 0.5px var(--line), 0 1px 2px rgba(0, 0, 0, 0.04);
				overflow: hidden;
			}
			.row {
				display: flex;
				align-items: center;
				gap: 10px;
				min-height: 44px;
				padding: 8px 12px;
				position: relative;
			}
			/* hairlines inset from the left, like a grouped list */
			.row + .row::before {
				content: "";
				position: absolute;
				top: 0;
				left: 12px;
				right: 0;
				border-top: 1px solid var(--line);
			}
			.label { flex: 1; min-width: 0; }
			.label small { display: block; margin-top: 1px; font-size: 11px; color: var(--muted); }

			/* a shortcut, one keycap per key */
			.keys { display: inline-flex; gap: 3px; font-size: 11.5px; color: var(--muted); }
			.keys kbd {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				min-width: 21px;
				height: 21px;
				padding: 0 5px;
				font: 500 11.5px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
				color: var(--fg);
				background: linear-gradient(var(--cap-top), var(--cap-bottom));
				border-radius: 5px;
				box-shadow: 0 0 0 0.5px var(--cap-edge), 0 1px 0 var(--cap-edge);
			}
			.keys.missing { color: var(--error); font-weight: 500; }
			.keys.recording {
				padding: 2px 8px;
				color: var(--accent);
				background: var(--accent-soft);
				border-radius: 6px;
				animation: pulse 1.2s ease-in-out infinite;
			}
			@keyframes pulse { 50% { opacity: 0.55; } }

			button {
				padding: 3px 6px;
				margin-right: -6px;
				font: inherit;
				font-size: 12.5px;
				font-weight: 500;
				color: var(--accent);
				background: none;
				border: 0;
				border-radius: 6px;
				cursor: pointer;
			}
			button:hover { background: var(--accent-soft); }
			button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
			#search-reset { color: var(--muted); margin-right: -2px; }

			.note { min-height: 0; margin: 6px 12px 0; font-size: 11.5px; color: var(--muted); }
			.note:empty { display: none; }
			.note.error { color: var(--error); }

			/* switches in place of checkboxes */
			label.row { cursor: pointer; }
			input[type="checkbox"] {
				appearance: none;
				flex: none;
				width: 32px;
				height: 19px;
				margin: 0;
				border-radius: 10px;
				background: var(--track);
				position: relative;
				cursor: pointer;
				transition: background 0.18s ease;
			}
			input[type="checkbox"]::before {
				content: "";
				position: absolute;
				top: 2px;
				left: 2px;
				width: 15px;
				height: 15px;
				border-radius: 50%;
				background: #fff;
				box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
				transition: transform 0.18s ease;
			}
			input[type="checkbox"]:checked { background: var(--accent); }
			input[type="checkbox"]:checked::before { transform: translateX(13px); }
			input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

			/* the groups settle in as the popup opens */
			header, section { animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
			section:nth-of-type(1) { animation-delay: 0.04s; }
			section:nth-of-type(2) { animation-delay: 0.08s; }
			@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
			@media (prefers-reduced-motion: reduce) {
				header, section, .keys.recording { animation: none; }
				input[type="checkbox"], input[type="checkbox"]::before { transition: none; }
			}
		</style>
	</head>
	<body>
		<header>
			<img src="icons/icon-48.png" alt="" />
			<h1>tabstack</h1>
		</header>

		<section>
			<h2>Shortcuts</h2>
			<div class="group">
				<div class="row">
					<span class="label">Switch tabs</span>
					<span class="keys" id="switch-key"></span>
					<button id="switch-change">Change</button>
				</div>
				<div class="row">
					<span class="label">Search tabs</span>
					<span class="keys" id="find-key"></span>
					<button id="find-change">Change</button>
				</div>
				<div class="row">
					<span class="label">Also search with<small>Web pages only</small></span>
					<span class="keys" id="search-key"></span>
					<button id="search-reset" hidden>Reset</button>
					<button id="search-change">Change</button>
				</div>
			</div>
			<p class="note" id="note"></p>
		</section>

		<section>
			<h2>Behavior</h2>
			<div class="group">
				<label class="row">
					<span class="label">Switch when search finds one tab</span>
					<input type="checkbox" id="auto-switch" />
				</label>
				<label class="row">
					<span class="label">Include recently closed tabs in search</span>
					<input type="checkbox" id="include-closed" />
				</label>
				<label class="row">
					<span class="label">Cycle through this window's tabs only</span>
					<input type="checkbox" id="this-window-only" />
				</label>
				<label class="row">
					<span class="label">Show timings</span>
					<input type="checkbox" id="show-timings" />
				</label>
			</div>
		</section>

		<script src="shared.js"></script>
		<script src="settings.js"></script>
	</body>
</html>
