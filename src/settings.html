<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>tabstack settings</title>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1d1d1f;
				--muted: #6e6e73;
				--line: rgba(0, 0, 0, 0.1);
				--chip: rgba(0, 0, 0, 0.05);
				--accent: #3b6cf6;
				--error: #c0392b;
				color-scheme: light dark;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					--bg: #1e1e20;
					--fg: #f5f5f7;
					--muted: #98989d;
					--line: rgba(255, 255, 255, 0.12);
					--chip: rgba(255, 255, 255, 0.08);
					--error: #ff6b5b;
				}
			}
			body {
				width: 320px;
				margin: 0;
				padding: 14px 16px 16px;
				font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
				color: var(--fg);
				background: var(--bg);
			}
			h1 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
			.row {
				display: flex;
				align-items: center;
				gap: 8px;
				padding: 10px 0;
				border-top: 1px solid var(--line);
			}
			.row > span:first-child { flex: 1; }
			kbd {
				min-width: 28px;
				padding: 3px 7px;
				font: 12px ui-monospace, Menlo, monospace;
				text-align: center;
				background: var(--chip);
				border: 1px solid var(--line);
				border-radius: 6px;
			}
			kbd.recording { color: var(--accent); border-color: var(--accent); }
			kbd.missing { color: var(--error); border-color: var(--error); }
			button {
				padding: 4px 9px;
				font: inherit;
				font-size: 12px;
				color: var(--fg);
				background: var(--chip);
				border: 1px solid var(--line);
				border-radius: 6px;
				cursor: pointer;
			}
			button:hover { border-color: var(--accent); }
			label.row { cursor: pointer; }
			input[type="checkbox"] { margin: 0; accent-color: var(--accent); }
			.note { min-height: 1em; margin: 2px 0 0; font-size: 11.5px; color: var(--muted); }
			.note.error { color: var(--error); }
		</style>
	</head>
	<body>
		<h1>tabstack</h1>

		<div class="row">
			<span>Switch tabs</span>
			<kbd id="switch-key">…</kbd>
			<button id="switch-change">Change</button>
		</div>
		<div class="row">
			<span>Search tabs</span>
			<kbd id="search-key">…</kbd>
			<button id="search-change">Change</button>
			<button id="search-reset" hidden>Reset</button>
		</div>
		<p class="note" id="note"></p>

		<label class="row">
			<span>Switch when search finds one tab</span>
			<input type="checkbox" id="auto-switch" />
		</label>
		<label class="row">
			<span>Include recently closed tabs in search</span>
			<input type="checkbox" id="include-closed" />
		</label>
		<label class="row">
			<span>Cycle through this window's tabs only</span>
			<input type="checkbox" id="this-window-only" />
		</label>
		<label class="row">
			<span>Show timings</span>
			<input type="checkbox" id="show-timings" />
		</label>

		<script src="shared.js"></script>
		<script src="settings.js"></script>
	</body>
</html>
